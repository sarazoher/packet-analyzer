[project]
name = "packet-analyzer"
version = "1.0.0"
description = "Dependency-free IPv4/TCP/UDP/ICMP packet analyzer and header parser"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
packet-analyzer = "packet_analyzer.cli:main"

[tool.setuptools]
packages = ["packet_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
